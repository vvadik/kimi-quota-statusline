name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regression tests
        run: python tests/test_regressions.py

      - name: Native status and quota smoke render
        env:
          KIMI_SL_NOCOLOR: '1'
          HOME: ${{ runner.temp }}/home
          KIMI_CODE_HOME: ${{ runner.temp }}/kc
        run: |
          mkdir -p "$HOME" "$KIMI_CODE_HOME"
          out=$(echo '{"model":"K3.1 Pro","cwd":"D:/пользователь/проект","gitBranch":"hidden","permissionMode":"auto","sessionId":"","version":"ci"}' | python statusline.py)
          test -n "$out"
          echo "$out" | grep -q 'K3.1 Pro'
          echo "$out" | grep -q '5h'
          echo "$out" | grep -q '7d'
          ! echo "$out" | grep -q 'hidden'
          echo "$out"

      - name: Install/uninstall roundtrip
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/kc
        run: |
          python install.py
          grep -q '^\[status_line\]' "$KIMI_CODE_HOME/tui.toml"
          python install.py
          python uninstall.py
          ! grep -q 'statusline\.py' "$KIMI_CODE_HOME/tui.toml"
          test ! -e "$KIMI_CODE_HOME/statusline-quota.json"
          test ! -e "$KIMI_CODE_HOME/statusline-quota-refresh.lock"

      - name: Windows isolated E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File ./tests/windows-e2e.ps1
